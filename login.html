<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Hotspot Azka Mikrotik</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="md5.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #0f2027);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      overflow: hidden;
      color: #fff;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating particles */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .particles span {
      position: absolute;
      display: block;
      width: 15px;
      height: 15px;
      background: rgba(0, 255, 255, 0.4);
      animation: move 20s linear infinite;
      border-radius: 50%;
    }

    .particles span:nth-child(1) { left: 10%; animation-duration: 12s; }
    .particles span:nth-child(2) { left: 25%; animation-duration: 18s; }
    .particles span:nth-child(3) { left: 50%; animation-duration: 20s; }
    .particles span:nth-child(4) { left: 75%; animation-duration: 15s; }
    .particles span:nth-child(5) { left: 90%; animation-duration: 25s; }

    @keyframes move {
      0% { top: 100%; opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { top: -10%; opacity: 0; transform: scale(0.5); }
    }

    .login-container {
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      text-align: center;
      width: 350px;
      backdrop-filter: blur(12px);
    }

    .login-container img.logo {
      width: 80px;
      margin-bottom: 15px;
    }

    h2 {
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 1.6rem;
      color: cyan;
    }

    p.subtitle {
      font-size: 0.9rem;
      margin-bottom: 25px;
      color: #ccc;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 40px 12px 15px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 0.95rem;
      transition: 0.3s;
    }

    .input-group input:focus {
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 10px cyan;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      fill: #aaa;
      transition: fill 0.3s;
      width: 20px;
      height: 20px;
    }

    .toggle-password:hover {
      fill: cyan;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, cyan, #007bff);
      color: #000;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      box-shadow: 0 0 20px cyan;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .socials a svg {
      width: 28px;
      height: 28px;
      fill: white;
      transition: transform 0.3s, fill 0.3s;
    }

    .socials a:hover svg {
      transform: scale(1.2);
      fill: cyan;
    }

.quote-slider {
  text-align: center;
  font-style: italic;
  color: #b9eefa;
  font-size: 0.85rem;
  margin-top: 10px;
  min-height: 40px;
}
.fade {
  animation: fadeIn 1s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.footer {
  text-align: center;
  font-size: 14px;
  color: #ccc;
  margin-top: 15px;
}
  </style>
</head>
<body>
  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="login-container">
    <img src="logo.jpg" alt="Azka Logo" class="logo">
    <h2>Welcome to the Azka Mikrotik Hotspot</h2>
    <p class="subtitle">Silahkan login untuk mengakses jaringan internet</p>

<form name="login" action="$(link-login-only)" method="post" onsubmit="return doLogin()">
  <input type="hidden" name="dst" value="$(link-orig)">
  <input type="hidden" name="popup" value="true">
  <input type="hidden" name="username">
  <input type="hidden" name="password">

  <div class="input-group">
    <input id="user" type="text" placeholder="Username" required>
  </div>
  <div class="input-group">
    <input id="pass" type="password" placeholder="Password" required>
    <svg id="togglePassword" class="toggle-password" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path class="eye" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/>
      <path class="eye-off" d="M2 2l20 20M4.5 4.5l15 15M12 4.5c-2.5 0-4.8 1-6.5 2.6M12 19.5c2.5 0 4.8-1 6.5-2.6" style="display: none;"/>
    </svg>
  </div>
  <button type="submit">Login</button>
</form>

    <div class="socials">
      <a href="https://youtube.com/@Fahazka" target="_blank">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M19.6 3H4.4A1.4 1.4 0 0 0 3 4.4v15.2A1.4 1.4 0 0 0 4.4 21h15.2a1.4 1.4 0 0 0 1.4-1.4V4.4A1.4 1.4 0 0 0 19.6 3zM10 15.5v-7l6 3.5-6 3.5z"/>
        </svg>
      </a>
      <a href="https://instagram.com/fakhriynazka" target="_blank">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 2a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h10zm-5 3a5 5 0 1 0 .001 10.001A5 5 0 0 0 12 7zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm4.5-.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
        </svg>
      </a>
    </div>

<div class="quote-slider">
  <p id="quoteText">"Selamat datang kembali. Semoga koneksi ini bukan cuma ke internet, tapi juga ke impian yang kamu kejar."</p>
</div>

<div class="footer">
  Powered by MikroTik RouterOS | By Fahazka &copy; 2025
</div>

  <script src="md5.js"></script>
<script>
  const togglePassword = document.getElementById("togglePassword");
  const password = document.getElementById("pass");
  let show = false;
  togglePassword.addEventListener("click", () => {
    show = !show;
    password.type = show ? "text" : "password";
    togglePassword.classList.toggle("active", show);
  });

  function doLogin() {
    document.login.username.value = document.getElementById('user').value;
    document.login.password.value = hexMD5('$(chap-id)' + document.getElementById('pass').value + '$(chap-challenge)');
    return true;
  }
    const quotes = [
    "Selamat datang kembali. Semoga koneksi ini bukan cuma ke internet, tapi juga ke impian yang kamu kejar.",
    "Login bukan sekadar akses. Ini langkah pertama menuju cerita yang ingin kamu bagikan.",
    "Hotspot ini nyala, dan semoga semangatmu juga. Yuk, sambungkan harapan hari ini.",
    "Koneksi dimulai di sini. Tapi cerita hebatmu dimulai dari langkah kecil ini.",
    "Kadang yang kita cari bukan sinyal, tapi ruang untuk merasa terhubung.",
    "Setiap login adalah awal baru. Semoga koneksi ini membawa kamu ke tempat yang kamu rindukan.",
    "Masuk jaringan itu mudah. Masuk ke hati seseorang? Butuh lebih dari sekadar password.",
    "Koneksi ini mungkin digital, tapi harapan yang kamu bawa itu nyata.",
    "Kadang kita login ke jaringan, kadang kita login ke kenangan.",
    "Koneksi stabil itu penting. Tapi koneksi yang tulus jauh lebih langka."
  ];

  let index = 0;
  const quoteText = document.getElementById("quoteText");

  function showQuote() {
    quoteText.classList.remove("fade");
    void quoteText.offsetWidth;
    quoteText.textContent = quotes[index];
    quoteText.classList.add("fade");
  }

  setInterval(() => {
    index = (index + 1) % quotes.length;
    showQuote();
  }, 7000);

  showQuote();
  // Redirect ke error.html jika login gagal
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get("error") === "true") {
    window.location.href = "error.html";
  }

</script>
</body>
</html>
