<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Azka Hotspot</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="md5.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030712;
      color: #fff;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    #bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .glow-1 {
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(0, 242, 254, 0.25);
      filter: blur(120px);
      border-radius: 50%;
      top: 10%;
      left: 15%;
      animation: floatGlow 10s ease-in-out infinite alternate;
      z-index: 0;
    }

    .glow-2 {
      position: absolute;
      width: 350px;
      height: 350px;
      background: rgba(124, 58, 237, 0.25);
      filter: blur(140px);
      border-radius: 50%;
      bottom: 10%;
      right: 15%;
      animation: floatGlow 12s ease-in-out infinite alternate-reverse;
      z-index: 0;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 50px) scale(1.2); }
    }

    .card-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      border-radius: 28px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.6), rgba(124, 58, 237, 0.2), rgba(0, 242, 254, 0.6));
      background-size: 200% 200%;
      animation: borderGlow 6s linear infinite;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.25), 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(10, 15, 30, 0.85);
      padding: 38px 30px;
      border-radius: 26px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 18px;
    }

    .logo {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(0, 242, 254, 0.8);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
      position: relative;
      z-index: 2;
    }

    .logo-container::after {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      border-radius: 50%;
      background: linear-gradient(45deg, #00f2fe, #7c3aed);
      z-index: 1;
      filter: blur(8px);
      opacity: 0.7;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #00f2fe 0%, #3b82f6 50%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 26px;
    }

    .input-group {
      position: relative;
      margin-bottom: 18px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 44px 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      outline: none;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 0.92rem;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: #00f2fe;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.3);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      fill: #64748b;
      width: 22px;
      height: 22px;
      transition: fill 0.3s;
    }

    .toggle-password:hover {
      fill: #00f2fe;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #00f2fe 0%, #0072ff 100%);
      color: #030712;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 6px;
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3);
    }

    button:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 10px 30px rgba(0, 242, 254, 0.5);
      color: #000;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 24px;
    }

    .socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .socials a svg {
      width: 22px;
      height: 22px;
      fill: #94a3b8;
      transition: all 0.3s ease;
    }

    .socials a:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: rgba(0, 242, 254, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 242, 254, 0.25);
    }

    .socials a:hover svg {
      fill: #00f2fe;
    }

    .quote-slider {
      margin-top: 22px;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .quote-slider p {
      font-size: 0.8rem;
      color: #cbd5e1;
      font-style: italic;
      line-height: 1.4;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .footer {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 22px;
    }

    .footer span {
      color: #00f2fe;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="card-wrapper">
    <div class="card">
      <div class="logo-container">
        <img src="logo.jpg" alt="Azka Logo" class="logo">
      </div>
      <h2>Azka Hotspot</h2>
      <p class="subtitle">Silakan login untuk mengakses jaringan internet</p>

      <form name="login" action="$(link-login-only)" method="post" onsubmit="return doLogin()">
        <input type="hidden" name="dst" value="$(link-orig)">
        <input type="hidden" name="popup" value="true">
        <input type="hidden" name="username">
        <input type="hidden" name="password">

        <div class="input-group">
          <input id="user" type="text" placeholder="Username" required autocomplete="off">
        </div>
        <div class="input-group">
          <input id="pass" type="password" placeholder="Password" required>
          <svg id="togglePassword" class="toggle-password" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/>
          </svg>
        </div>
        <button type="submit">CONNECT INTERNET</button>
      </form>

      <div class="socials">
        <a href="https://github.com/fakhriynazka" target="_blank" title="GitHub">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        </a>
        <a href="https://youtube.com/@Fahazka" target="_blank" title="YouTube">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </a>
        <a href="https://instagram.com/fakhriynazka" target="_blank" title="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        </a>
      </div>

      <div class="quote-slider">
        <p id="quoteText">"Selamat datang kembali! Sambungkan harapan dan impianmu hari ini."</p>
      </div>

      <div class="footer">
        Powered by MikroTik RouterOS | <span>Fahazka &copy; 2026</span>
      </div>
    </div>
  </div>

  <script>
    const togglePassword = document.getElementById("togglePassword");
    const password = document.getElementById("pass");
    let show = false;

    togglePassword.addEventListener("click", () => {
      show = !show;
      password.type = show ? "text" : "password";
    });

    function doLogin() {
      document.login.username.value = document.getElementById('user').value;
      document.login.password.value = hexMD5('$(chap-id)' + document.getElementById('pass').value + '$(chap-challenge)');
      return true;
    }

    // Quote Slider
    const quotes = [
      "Selamat datang kembali! Sambungkan harapan dan impianmu hari ini.",
      "Login bukan sekadar akses, tapi awal cerita baru.",
      "Hotspot aktif, siap menemani setiap jam produktifmu.",
      "Setiap koneksi punya cerita, pastikan harimu luar biasa!",
      "Tetap terhubung, tetap berkarya bersama Fahazka."
    ];

    let index = 0;
    const quoteText = document.getElementById("quoteText");

    function showQuote() {
      quoteText.style.opacity = 0;
      quoteText.style.transform = "translateY(5px)";
      setTimeout(() => {
        quoteText.textContent = quotes[index];
        quoteText.style.opacity = 1;
        quoteText.style.transform = "translateY(0)";
      }, 300);
    }

    setInterval(() => {
      index = (index + 1) % quotes.length;
      showQuote();
    }, 6000);

    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.size = Math.random() * 2 + 1;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }

      draw() {
        ctx.fillStyle = "rgba(0, 242, 254, 0.6)";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 55; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 110) {
            ctx.strokeStyle = `rgba(0, 242, 254, ${1 - dist / 110})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("error") === "true") {
      window.location.href = "error.html";
    }
  </script>
</body>
</html>
