<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logout - Azka Hotspot</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #030712; color: #fff; padding: 20px; overflow: hidden;
    }
    .card-wrapper {
      position: relative; z-index: 2; width: 100%; max-width: 400px; border-radius: 28px; padding: 2px;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.6), rgba(124, 58, 237, 0.2));
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.25);
    }
    .card { background: rgba(10, 15, 30, 0.85); padding: 38px 30px; border-radius: 26px; text-align: center; backdrop-filter: blur(20px); }
    h2 { font-size: 1.4rem; font-weight: 800; color: #00f2fe; margin-bottom: 8px; }
    p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    a.btn-login {
      display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #00f2fe, #0072ff);
      color: #030712; border-radius: 14px; text-decoration: none; font-weight: 700; transition: all 0.3s ease;
    }
    a.btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4); }
  </style>
</head>
<body>
  <div class="card-wrapper">
    <div class="card">
      <h2>Terima Kasih!</h2>
      <p>Sesi internet Anda telah diputuskan. Sampai jumpa di sesi berikutnya!</p>
      <a href="login.html" class="btn-login">LOGIN KEMBALI</a>
    </div>
  </div>
</body>
</html>
