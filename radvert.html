<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Azka Hotspot</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #030712; color: #fff; padding: 20px; text-align: center;
    }
    .welcome-card {
      background: rgba(10, 15, 30, 0.85); padding: 35px; border-radius: 24px;
      border: 1px solid rgba(0, 242, 254, 0.3); box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
      max-width: 500px; backdrop-filter: blur(20px);
    }
    h2 { font-size: 1.6rem; color: #00f2fe; margin-bottom: 12px; font-weight: 800; }
    p { color: #cbd5e1; font-style: italic; font-size: 0.95rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="welcome-card">
    <h2>Selamat Datang di Jaringan Hotspot</h2>
    <p>"Teknologi menyatukan kita, tapi rasa yang membuat kita benar-benar terhubung." — Fahazka</p>
  </div>
</body>
</html>
