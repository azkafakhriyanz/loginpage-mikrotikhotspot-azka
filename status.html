<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Koneksi - Azka Hotspot</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #030712; color: #fff; padding: 20px; overflow-x: hidden; position: relative;
    }
    #bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .glow-1 { position: absolute; width: 300px; height: 300px; background: rgba(0, 242, 254, 0.2); filter: blur(120px); border-radius: 50%; top: 10%; left: 10%; }
    .card-wrapper {
      position: relative; z-index: 2; width: 100%; max-width: 400px; border-radius: 28px; padding: 2px;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.6), rgba(124, 58, 237, 0.2));
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.25);
    }
    .card { background: rgba(10, 15, 30, 0.85); padding: 35px 28px; border-radius: 26px; text-align: center; backdrop-filter: blur(20px); }
    .status-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4); border-radius: 20px; color: #34d399; font-size: 0.8rem; font-weight: 700; margin-bottom: 16px;
    }
    .status-dot { width: 8px; height: 8px; background: #34d399; border-radius: 50%; box-shadow: 0 0 10px #34d399; }
    h2 { font-size: 1.4rem; font-weight: 800; color: #00f2fe; margin-bottom: 20px; }
    .info-list { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); padding: 18px; border-radius: 16px; margin-bottom: 22px; }
    .info-item { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .info-item:last-child { border-bottom: none; }
    .info-label { color: #94a3b8; }
    .info-value { color: #f8fafc; font-weight: 600; }
    a.logout-btn {
      display: block; width: 100%; padding: 14px; background: rgba(239, 68, 68, 0.15);
      color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 14px;
      text-decoration: none; font-weight: 700; transition: all 0.3s ease;
    }
    a.logout-btn:hover { background: rgba(239, 68, 68, 0.25); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="glow-1"></div>
  <div class="card-wrapper">
    <div class="card">
      <div class="status-badge"><span class="status-dot"></span> CONNECTED</div>
      <h2>Status Koneksi</h2>
      <div class="info-list">
        <div class="info-item"><span class="info-label">IP Address</span><span class="info-value">$(ip)</span></div>
        <div class="info-item"><span class="info-label">MAC Address</span><span class="info-value">$(mac)</span></div>
        <div class="info-item"><span class="info-label">Durasi Aktif</span><span class="info-value">$(uptime)</span></div>
        <div class="info-item"><span class="info-label">Penggunaan Data</span><span class="info-value">$(bytes-out-nice)</span></div>
      </div>
      <a href="$(link-logout)" class="logout-btn">DISCONNECT / LOGOUT</a>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let particles = [];
    for(let i=0; i<35; i++){ particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.6, vy: (Math.random()-0.5)*0.6 }); }
    function animate(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if(p.x<0||p.x>canvas.width) p.vx*=-1;
        if(p.y<0||p.y>canvas.height) p.vy*=-1;
        ctx.fillStyle = "rgba(0, 242, 254, 0.5)"; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
